name: Forge - Build One
run-name: >-
  Forge - ${{ inputs.repo_url || inputs.tool_id || 'catalog-run' }}

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: Repository URL
        required: true
        type: string
        default: ""
      git_ref:
        description: Exact tag, branch, or commit
        required: false
        type: string
        default: ""
      project_path:
        description: Solution or project path
        required: false
        type: string
        default: ""
      configuration:
        description: Build configuration
        required: false
        type: string
        default: ""
      target_framework:
        description: Target framework
        required: false
        type: string
        default: ""
      version_override:
        description: Custom release label
        required: false
        type: string
        default: ""
      asset_include:
        description: Asset include filter
        required: false
        type: string
        default: ""
      asset_exclude:
        description: Asset exclude filter
        required: false
        type: string
        default: ""
      force_rebuild:
        description: Skip cache for this run
        required: false
        type: boolean
        default: false
      build_type:
        description: Build output type
        required: false
        type: choice
        default: bundle
        options:
          - bundle
          - standalone
          - both

  workflow_call:
    inputs:
      tool_id:
        required: false
        type: string
        default: ""
      repo_url:
        required: false
        type: string
        default: ""
      git_ref:
        required: false
        type: string
        default: ""
      project_path:
        required: false
        type: string
        default: ""
      configuration:
        required: false
        type: string
        default: ""
      target_framework:
        required: false
        type: string
        default: ""
      version_override:
        required: false
        type: string
        default: ""
      asset_include:
        required: false
        type: string
        default: ""
      asset_exclude:
        required: false
        type: string
        default: ""
      force_rebuild:
        required: false
        type: boolean
        default: false
      build_type:
        required: false
        type: string
        default: bundle

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      repo_url: ${{ steps.resolve.outputs.repo_url }}
      tool_id: ${{ steps.resolve.outputs.tool_id }}
      project_path: ${{ steps.detect.outputs.project_path }}
      configuration: ${{ steps.resolve.outputs.configuration }}
      target_framework: ${{ steps.resolve.outputs.target_framework }}
      git_ref: ${{ steps.resolve.outputs.git_ref }}
      version_strategy: ${{ steps.resolve.outputs.version_strategy }}
      asset_include: ${{ steps.resolve.outputs.asset_include }}
      asset_exclude: ${{ steps.resolve.outputs.asset_exclude }}
      restore_mode: ${{ steps.detect.outputs.restore_mode }}
      build_mode: ${{ steps.detect.outputs.build_mode }}
      is_sdk_style: ${{ steps.detect.outputs.is_sdk_style }}
      required_sdk: ${{ steps.detect.outputs.required_sdk }}
      resolved_commit: ${{ steps.meta.outputs.resolved_commit }}
      short_commit: ${{ steps.meta.outputs.short_commit }}
      resolved_tag: ${{ steps.meta.outputs.resolved_tag }}
      resolved_ref: ${{ steps.meta.outputs.resolved_ref }}
      version_label: ${{ steps.meta.outputs.version_label }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      asset_prefix: ${{ steps.meta.outputs.asset_prefix }}
      build_key: ${{ steps.meta.outputs.build_key }}
      skip_build: ${{ steps.detect.outputs.skip_build || steps.meta.outputs.skip_build }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Resolve catalog settings
        id: resolve
        run: |
          python scripts/catalog_tool.py resolve \
            "${{ inputs.tool_id }}" \
            "${{ inputs.repo_url }}"

      - name: Resolve source revision
        id: meta
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          repo_url="${{ steps.resolve.outputs.repo_url }}"
          tool_id="${{ steps.resolve.outputs.tool_id }}"
          requested_ref="${{ inputs.git_ref }}"
          if [ -z "$requested_ref" ]; then
            requested_ref="${{ steps.resolve.outputs.git_ref }}"
          fi

          resolved_commit=""
          if [ -n "$requested_ref" ]; then
            resolved_commit="$(git ls-remote "$repo_url" "$requested_ref" | awk '{print $1; exit}')"
            if [ -z "$resolved_commit" ]; then
              resolved_commit="$(git ls-remote "$repo_url" "refs/tags/$requested_ref" | awk '{print $1; exit}')"
            fi
          fi
          if [ -z "$resolved_commit" ]; then
            resolved_commit="$(git ls-remote "$repo_url" HEAD | awk '{print $1; exit}')"
          fi

          if [ -z "$resolved_commit" ]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "### Validation Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- Unable to resolve any commit from $repo_url" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          short_commit="${resolved_commit:0:12}"
          resolved_tag=""
          if [ -n "$requested_ref" ]; then
            resolved_tag="$(git ls-remote "$repo_url" "refs/tags/$requested_ref" | awk '{print $2; exit}' | sed 's|refs/tags/||' || true)"
          fi
          if [ -z "$resolved_tag" ]; then
            latest_tag="$(git ls-remote --tags "$repo_url" | awk '{print $2}' | sed 's|refs/tags/||' | sort -V | tail -n 1 || true)"
            tag_commit="$(git ls-remote "$repo_url" "refs/tags/$latest_tag" | awk '{print $1; exit}' || true)"
            if [ "$tag_commit" = "$resolved_commit" ] || [ "${{ steps.resolve.outputs.version_strategy }}" = "tag_then_commit" ]; then
              resolved_tag="$latest_tag"
            fi
          fi

          version_label="${{ inputs.version_override }}"
          if [ -z "$version_label" ]; then
            if [ -n "$resolved_tag" ]; then
              version_label="$resolved_tag"
            else
              version_label="$short_commit"
            fi
          fi

          safe_version="$(printf '%s' "$version_label" | sed 's/[^0-9A-Za-z._-]/-/g')"
          release_tag="tool/$tool_id/$short_commit"
          if [ "$safe_version" = "$short_commit" ]; then
            release_name="$tool_id - $short_commit"
          else
            release_name="$tool_id - $version_label"
          fi
          asset_prefix="${tool_id}_${short_commit}"
          build_key="${repo_url}@${resolved_commit}"

          echo "resolved_commit=$resolved_commit" >> "$GITHUB_OUTPUT"
          echo "short_commit=$short_commit" >> "$GITHUB_OUTPUT"
          echo "resolved_tag=$resolved_tag" >> "$GITHUB_OUTPUT"
          echo "resolved_ref=$requested_ref" >> "$GITHUB_OUTPUT"
          echo "version_label=$version_label" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=$asset_prefix" >> "$GITHUB_OUTPUT"
          echo "build_key=$build_key" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            echo "### Cache bypassed (force_rebuild)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if gh release view "$release_tag" --json tagName --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "### Cache hit" >> "$GITHUB_STEP_SUMMARY"
            echo "- $release_tag" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### Resolved build" >> "$GITHUB_STEP_SUMMARY"
          echo "- repo: $repo_url" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: ${requested_ref:-<default>}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: ${resolved_tag:-<none>}" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: $resolved_commit" >> "$GITHUB_STEP_SUMMARY"
          echo "- release tag: $release_tag" >> "$GITHUB_STEP_SUMMARY"
          echo "- version label: $version_label" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect project via API
        id: detect
        run: |
          set -euo pipefail

          repo_url="${{ steps.resolve.outputs.repo_url }}"
          resolved_commit="${{ steps.meta.outputs.resolved_commit }}"

          owner_repo="$(echo "$repo_url" | sed -n 's|https://github.com/||p' | sed 's|/$||')"
          owner="$(echo "$owner_repo" | cut -d/ -f1)"
          repo="$(echo "$owner_repo" | cut -d/ -f2)"
          repo_name="$repo"

          # Fetch full file tree via API
          tree_json="$(gh api "repos/$owner/$repo/git/trees/$resolved_commit?recursive=1" 2>/dev/null || true)"

          if [ -z "$tree_json" ]; then
            echo "### API tree fetch failed, falling back to git clone" >> "$GITHUB_STEP_SUMMARY"
            git clone --filter=blob:none "$repo_url" target
            cd target
            tree_json='{"tree": []}'
            local_clone=true
          else
            local_clone=false
          fi

          # Helper: list files matching pattern
          list_files() {
            local pattern="$1"
            local exclude="$2"
            if [ "$local_clone" = true ]; then
              if [ -n "$exclude" ]; then
                find . -name "*$pattern" ! -iname "*$exclude*" | sort | sed 's|^\./||'
              else
                find . -name "*$pattern" | sort | sed 's|^\./||'
              fi
            else
              if [ -n "$exclude" ]; then
                echo "$tree_json" | jq -r --arg pat "$pattern" --arg excl "$exclude" \
                  '.tree[] | select(.type == "blob") | select(.path | endswith($pat)) | select(.path | test($excl; "i") | not) | .path' | sort
              else
                echo "$tree_json" | jq -r --arg pat "$pattern" \
                  '.tree[] | select(.type == "blob") | select(.path | endswith($pat)) | .path' | sort
              fi
            fi
          }

          # Helper: read file content
          read_file() {
            local path="$1"
            if [ "$local_clone" = true ]; then
              cat "$path" 2>/dev/null || true
            else
              local blob_sha
              blob_sha="$(echo "$tree_json" | jq -r --arg p "$path" '.tree[] | select(.path == $p) | .sha' | head -n 1)"
              if [ -n "$blob_sha" ]; then
                gh api "repos/$owner/$repo/git/blobs/$blob_sha" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true
              fi
            fi
          }

          has_dotnet=false
          has_cpp=false

          dotnet_files="$(list_files ".csproj" "")
$(list_files ".sln" "")
$(list_files ".vbproj" "")"
          if echo "$dotnet_files" | grep -qE '\.(csproj|sln|vbproj)$'; then
            has_dotnet=true
          fi
          if [ "$(list_files ".vcxproj" "" | wc -w)" -gt 0 ]; then
            has_cpp=true
          fi

          if [ "$has_dotnet" = false ] && [ "$has_cpp" = false ]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "### Validation Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- No .csproj, .sln, .vbproj, or .vcxproj files found" >> "$GITHUB_STEP_SUMMARY"
            echo "- Forge only builds .NET/C# projects" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$has_dotnet" = false ] && [ "$has_cpp" = true ]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "### Validation Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- Only C++ (.vcxproj) projects found, no .NET projects (.csproj/.sln/.vbproj)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Forge only builds .NET/C# projects" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Detect project file
          manual_path="${{ inputs.project_path }}"
          if [ -z "$manual_path" ]; then
            manual_path="${{ steps.resolve.outputs.project_path }}"
          fi

          project_path=""
          if [ -n "$manual_path" ]; then
            if [ "$local_clone" = true ] && [ -f "$manual_path" ]; then
              project_path="$manual_path"
            elif [ "$local_clone" = false ] && echo "$dotnet_files" | grep -qxF "$manual_path"; then
              project_path="$manual_path"
            else
              echo "skip_build=true" >> "$GITHUB_OUTPUT"
              echo "### Provided project_path not found" >> "$GITHUB_STEP_SUMMARY"
              echo "- $manual_path" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            sln_files="$(list_files ".sln" "test")"
            root_sln="$(echo "$sln_files" | grep -E '^[^/]+\.sln$' || true)"
            named_root_sln="$(echo "$root_sln" | grep -iE "^${repo_name}\.sln$" || true)"
            named_sln="$(echo "$sln_files" | grep -iE "/${repo_name}\.sln$" || true)"

            if [ -n "$named_root_sln" ] && [ "$(echo "$named_root_sln" | wc -l)" -eq 1 ]; then
              project_path="$named_root_sln"
            elif [ -n "$root_sln" ] && [ "$(echo "$root_sln" | wc -l)" -eq 1 ]; then
              project_path="$root_sln"
            elif [ -n "$named_sln" ] && [ "$(echo "$named_sln" | wc -l)" -eq 1 ]; then
              project_path="$named_sln"
            elif [ -n "$sln_files" ] && [ "$(echo "$sln_files" | wc -l)" -eq 1 ]; then
              project_path="$(echo "$sln_files" | head -n 1)"
            else
              csproj_files="$(list_files ".csproj" "test")"
              root_csproj="$(echo "$csproj_files" | grep -E '^[^/]+\.csproj$' || true)"
              named_root_csproj="$(echo "$root_csproj" | grep -iE "^${repo_name}\.csproj$" || true)"
              named_csproj="$(echo "$csproj_files" | grep -iE "/${repo_name}\.csproj$" || true)"

              if [ -n "$named_root_csproj" ] && [ "$(echo "$named_root_csproj" | wc -l)" -eq 1 ]; then
                project_path="$named_root_csproj"
              elif [ -n "$root_csproj" ] && [ "$(echo "$root_csproj" | wc -l)" -eq 1 ]; then
                project_path="$root_csproj"
              elif [ -n "$named_csproj" ] && [ "$(echo "$named_csproj" | wc -l)" -eq 1 ]; then
                project_path="$named_csproj"
              elif [ -n "$csproj_files" ] && [ "$(echo "$csproj_files" | wc -l)" -eq 1 ]; then
                project_path="$(echo "$csproj_files" | head -n 1)"
              elif [ -z "$sln_files" ] && [ -z "$csproj_files" ]; then
                echo "skip_build=true" >> "$GITHUB_OUTPUT"
                echo "### No .sln or .csproj files found" >> "$GITHUB_STEP_SUMMARY"
                echo "- Supply project_path input or add a .sln/.csproj to the repository" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              else
                echo "skip_build=true" >> "$GITHUB_OUTPUT"
                echo "### Project auto-detection is ambiguous" >> "$GITHUB_STEP_SUMMARY"
                echo "- Supply project_path input to disambiguate" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi

          echo "project_path=$project_path" >> "$GITHUB_OUTPUT"

          # Detect restore_mode
          has_packages_config=false
          if [ "$local_clone" = true ]; then
            if find . -name 'packages.config' | grep -q .; then
              has_packages_config=true
            fi
          else
            if echo "$tree_json" | jq -r '.tree[] | select(.type == "blob") | .path' | grep -q 'packages\.config'; then
              has_packages_config=true
            fi
          fi

          has_legacy_imports=false
          if [ "$has_dotnet" = true ]; then
            for f in $(list_files ".csproj" "") $(list_files ".vbproj" ""); do
              [ -z "$f" ] && continue
              content="$(read_file "$f")"
              if echo "$content" | grep -qE '(\.\./)?packages/.+\.(props|targets)|<HintPath>.*(\.\./)?packages/'; then
                has_legacy_imports=true
                break
              fi
            done
          fi

          restore_mode="${{ steps.resolve.outputs.restore_mode }}"
          if [ -z "$restore_mode" ] || [ "$restore_mode" = "auto" ]; then
            if [ "$has_packages_config" = true ] || [ "$has_legacy_imports" = true ]; then
              restore_mode="legacy_nuget_strict"
            else
              restore_mode="msbuild_restore"
            fi
          fi
          echo "restore_mode=$restore_mode" >> "$GITHUB_OUTPUT"

          # Detect build_mode and SDK-style
          is_sdk_style=false
          if [ -n "$project_path" ]; then
            project_content="$(read_file "$project_path")"
            if echo "$project_content" | grep -q '<Project Sdk='; then
              is_sdk_style=true
            fi
          fi
          echo "is_sdk_style=$is_sdk_style" >> "$GITHUB_OUTPUT"

          is_solution=false
          if echo "$project_path" | grep -qiE '\.sln$'; then
            is_solution=true
          fi

          build_mode="${{ steps.resolve.outputs.build_mode }}"
          if [ -z "$build_mode" ] || [ "$build_mode" = "auto" ]; then
            if [ "$is_solution" = true ]; then
              build_mode="solution_default_output"
            else
              build_mode="project_redirect_output"
            fi
          fi
          echo "build_mode=$build_mode" >> "$GITHUB_OUTPUT"

          # Detect required .NET SDK version
          required_sdk=""
          if [ "$is_sdk_style" = "true" ] && [ -n "$project_path" ]; then
            project_content="$(read_file "$project_path")"
            tfms="$(echo "$project_content" | grep -oP '<TargetFramework[^>]*>\s*net\d+\.\d+\s*</TargetFramework>' | grep -oP 'net\d+\.\d+' || true)"
            if [ -z "$tfms" ]; then
              tfms="$(echo "$project_content" | grep -oP '<TargetFrameworks[^>]*>\s*([^<]+)\s*</TargetFrameworks>' | grep -oP 'net\d+\.\d+' || true)"
            fi
            if [ -n "$tfms" ]; then
              highest="$(echo "$tfms" | tr ' ' '\n' | sort -V | tail -n 1)"
              case "$highest" in
                net6.0) required_sdk="6.0.x" ;;
                net7.0) required_sdk="7.0.x" ;;
                net8.0) required_sdk="8.0.x" ;;
                net9.0) required_sdk="9.0.x" ;;
                *)     required_sdk="8.0.x" ;;
              esac
            else
              required_sdk="8.0.x"
            fi
          fi
          echo "required_sdk=$required_sdk" >> "$GITHUB_OUTPUT"

          {
            echo "### Detected project"
            echo "- project: $project_path"
            echo "- restore mode: $restore_mode"
            echo "- build mode: $build_mode"
            echo "- SDK-style: $is_sdk_style"
            if [ -n "$required_sdk" ]; then
              echo "- required SDK: $required_sdk"
            else
              echo "- required SDK: none (MSBuild only)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Final cleanup: remove local clone if used
          [ "$local_clone" = true ] && rm -rf target

  build:
    needs: preflight
    if: needs.preflight.outputs.skip_build != 'true'
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup .NET SDK
        if: needs.preflight.outputs.required_sdk != ''
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.preflight.outputs.required_sdk }}

      - name: Clone target repository
        working-directory: ${{ github.workspace }}
        run: |
          $url = "${{ needs.preflight.outputs.repo_url }}"
          git clone "$url" target
          if ($LASTEXITCODE -ne 0) { throw "Clone failed: $url" }
          Set-Location target
          git fetch --tags --force
          git checkout "${{ needs.preflight.outputs.resolved_commit }}"
          if ($LASTEXITCODE -ne 0) { throw "Unable to checkout commit: ${{ needs.preflight.outputs.resolved_commit }}" }
          git submodule update --init --recursive

      - name: Inject .NET Framework reference assembly package
        working-directory: ${{ github.workspace }}\target
        run: |
          $propsPath = Join-Path (Get-Location) "Directory.Build.props"
          $existingContent = ""
          if (Test-Path $propsPath) {
            $existingContent = Get-Content $propsPath -Raw
            if ($existingContent -match "Microsoft\.NETFramework\.ReferenceAssemblies") {
              Write-Host "Reference assembly package already configured"
            } else {
              Write-Host "WARNING: Directory.Build.props exists but lacks reference assemblies"
            }
          } else {
            $propsContent = @(
              '<Project>',
              '  <ItemGroup>',
              '    <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies" Version="1.0.3" PrivateAssets="All" />',
              '  </ItemGroup>',
              '</Project>'
            ) -join "`n"
            Set-Content -Path $propsPath -Value $propsContent -Encoding UTF8
            Write-Host "Injected reference assemblies"
          }

      - name: Resolve project path
        id: project
        working-directory: ${{ github.workspace }}\target
        run: |
          $projectPath = "${{ needs.preflight.outputs.project_path }}"
          if ([string]::IsNullOrWhiteSpace($projectPath)) {
            $projectPath = "${{ inputs.project_path }}"
          }

          if ([string]::IsNullOrWhiteSpace($projectPath)) {
            throw "No project path available from preflight or inputs."
          }

          $resolved = Join-Path (Get-Location) $projectPath
          if (-not (Test-Path $resolved)) { throw "Project path not found: $resolved" }
          $projectFile = (Resolve-Path $resolved).Path

          Write-Host "Project: $projectFile"
          "path=$projectFile" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        working-directory: ${{ github.workspace }}\target
        run: |
          $projectFile = "${{ steps.project.outputs.path }}"
          $restoreTarget = $projectFile
          $repoRoot = (Get-Location).Path
          $solutionDir = Split-Path $projectFile -Parent
          if ($projectFile.EndsWith(".csproj")) {
            $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
            if ($sln) {
              $restoreTarget = $sln.FullName
              $solutionDir = Split-Path $sln.FullName -Parent
            }
          }

          $packagesDir = Join-Path $solutionDir "packages"
          $restoreMode = "${{ needs.preflight.outputs.restore_mode }}"
          if ([string]::IsNullOrWhiteSpace($restoreMode) -or $restoreMode -eq "auto") {
            $hasPackagesConfig = (Get-ChildItem -Recurse -Filter packages.config | Measure-Object).Count -gt 0
            $hasLegacyPackageImports = (Get-ChildItem -Recurse -Include *.csproj,*.vbproj -File | Select-String -Pattern '(?i)(?:\.\.[\\/])?packages[\\/].+\.(?:props|targets)|<HintPath>.*(?:\.\.[\\/])?packages[\\/]' | Select-Object -First 1) -ne $null
            if ($hasPackagesConfig -or $hasLegacyPackageImports) {
              $restoreMode = "legacy_nuget_strict"
            } else {
              $restoreMode = "msbuild_restore"
            }
          }

          switch ($restoreMode) {
            "legacy_nuget" {
              nuget restore "$restoreTarget" -NonInteractive -PackagesDirectory "$packagesDir" -SolutionDirectory "$repoRoot"
              if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }
            }
            "legacy_nuget_strict" {
              nuget restore "$restoreTarget" -NonInteractive -PackagesDirectory "$packagesDir" -SolutionDirectory "$repoRoot"
              if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }

              Get-ChildItem -Recurse -Filter packages.config | ForEach-Object {
                nuget restore "$($_.FullName)" -NonInteractive -PackagesDirectory "$packagesDir" -SolutionDirectory "$repoRoot"
                if ($LASTEXITCODE -ne 0) { throw "packages.config restore failed: $($_.FullName)" }
              }
            }
            "msbuild_restore" {
              msbuild "$restoreTarget" /t:Restore /p:RestorePackagesConfig=true /verbosity:minimal
              if ($LASTEXITCODE -ne 0) { throw "MSBuild restore failed" }
            }
            "dotnet_restore" {
              dotnet restore "$projectFile"
              if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed" }
            }
            default {
              nuget restore "$restoreTarget" -NonInteractive -PackagesDirectory "$packagesDir" -SolutionDirectory "$repoRoot"
              if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }

              msbuild "$restoreTarget" /t:Restore /p:RestorePackagesConfig=true /verbosity:minimal
              if ($LASTEXITCODE -ne 0) {
                dotnet restore "$projectFile"
                if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
              }
            }
          }

      - name: Build project
        working-directory: ${{ github.workspace }}\target
        run: |
          $out = "${{ github.workspace }}\out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $cfg = "${{ inputs.configuration }}"
          if ([string]::IsNullOrWhiteSpace($cfg)) {
            $cfg = "${{ needs.preflight.outputs.configuration }}"
          }
          if ([string]::IsNullOrWhiteSpace($cfg)) { $cfg = "Release" }

          $fw = "${{ inputs.target_framework }}"
          if ([string]::IsNullOrWhiteSpace($fw)) {
            $fw = "${{ needs.preflight.outputs.target_framework }}"
          }

          $projectFile = "${{ steps.project.outputs.path }}"
          $isSolution = $projectFile.EndsWith(".sln")
          $buildMode = "${{ needs.preflight.outputs.build_mode }}"
          if ([string]::IsNullOrWhiteSpace($buildMode) -or $buildMode -eq "auto") {
            if ($isSolution) {
              $buildMode = "solution_default_output"
            } else {
              $buildMode = "project_redirect_output"
            }
          }

          $msbuildArgs = @(
            $projectFile,
            "/p:Configuration=$cfg",
            "/p:DebugType=None",
            "/p:DebugSymbols=false",
            "/m",
            "/restore:false",
            "/verbosity:minimal"
          )
          if ($buildMode -eq "project_redirect_output" -or $buildMode -eq "solution_redirect_output") {
            $msbuildArgs += "/p:OutDir=$out\\"
          }

          if (-not [string]::IsNullOrWhiteSpace($fw) -and $fw -match '^net(\d+)(\d+)$') {
            $tfv = "v{0}.{1}" -f $Matches[1], $Matches[2]
            $msbuildArgs += "/p:TargetFrameworkVersion=$tfv"
          }

          msbuild @msbuildArgs
          if ($LASTEXITCODE -ne 0) {
            $dotnetArgs = @(
              "build",
              $projectFile,
              "--configuration", $cfg,
              "--no-restore",
              "-p:DebugType=None",
              "-p:DebugSymbols=false"
            )
            if ($buildMode -eq "project_redirect_output" -or $buildMode -eq "solution_redirect_output") {
              $dotnetArgs += "--output"
              $dotnetArgs += $out
            }
            if (-not [string]::IsNullOrWhiteSpace($fw)) {
              $dotnetArgs += "--framework"
              $dotnetArgs += $fw
            }
            dotnet @dotnetArgs
            if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          }

      - name: Build standalone
        if: steps.project.outputs.path != '' && needs.preflight.outputs.is_sdk_style == 'true' && (inputs.build_type == 'standalone' || inputs.build_type == 'both')
        run: |
          $projectFile = "${{ steps.project.outputs.path }}"
          $outStandalone = "${{ github.workspace }}\out-standalone"
          New-Item -ItemType Directory -Force -Path $outStandalone | Out-Null

          $cfg = "${{ inputs.configuration }}"
          if ([string]::IsNullOrWhiteSpace($cfg)) {
            $cfg = "${{ needs.preflight.outputs.configuration }}"
          }
          if ([string]::IsNullOrWhiteSpace($cfg)) { $cfg = "Release" }

          $fw = "${{ inputs.target_framework }}"
          if ([string]::IsNullOrWhiteSpace($fw)) {
            $fw = "${{ needs.preflight.outputs.target_framework }}"
          }

          $publishArgs = @(
            "publish",
            $projectFile,
            "--configuration", $cfg,
            "--self-contained",
            "-p:PublishSingleFile=true",
            "--output", $outStandalone
          )
          if (-not [string]::IsNullOrWhiteSpace($fw)) {
            $publishArgs += "--framework"
            $publishArgs += $fw
          }

          dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) { throw "Standalone publish failed" }

      - name: Collect artifacts
        id: collect
        working-directory: ${{ github.workspace }}\target
        run: |
          $collect = "${{ github.workspace }}\artifact"
          New-Item -ItemType Directory -Force -Path $collect | Out-Null

          $includeRaw = "${{ inputs.asset_include }}"
          if ([string]::IsNullOrWhiteSpace($includeRaw)) {
            $includeRaw = "${{ needs.preflight.outputs.asset_include }}"
          }
          $excludeRaw = "${{ inputs.asset_exclude }}"
          if ([string]::IsNullOrWhiteSpace($excludeRaw)) {
            $excludeRaw = "${{ needs.preflight.outputs.asset_exclude }}"
          }

          $includePatterns = @("*.exe", "*.dll")
          if (-not [string]::IsNullOrWhiteSpace($includeRaw)) {
            $includePatterns = $includeRaw.Split(",", [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim() }
          }
          $excludePatterns = @(
            "*vshost*",
            "*testhost*",
            "*.resources.dll",
            "Microsoft.*",
            "MSBuild*"
          )
          if (-not [string]::IsNullOrWhiteSpace($excludeRaw)) {
            $excludePatterns += $excludeRaw.Split(",", [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim() }
          }

          $projectFile = "${{ steps.project.outputs.path }}"
          $searchRoots = @("${{ github.workspace }}\out")
          if (Test-Path "${{ github.workspace }}\out-standalone") {
            $searchRoots += "${{ github.workspace }}\out-standalone"
          }
          if ($projectFile.EndsWith(".sln")) {
            $searchRoots += (Get-Location).Path
          } else {
            $projectDir = Split-Path $projectFile -Parent
            if ($projectDir -and $projectDir -ne (Get-Location).Path) {
              $searchRoots += $projectDir
            }
          }

          $copied = @()
          foreach ($pattern in $includePatterns) {
            foreach ($root in ($searchRoots | Sort-Object -Unique)) {
              if (-not (Test-Path $root)) { continue }
              Get-ChildItem "$root" -Recurse -File -Include $pattern | ForEach-Object {
                $skip = $false
                foreach ($exclude in $excludePatterns) {
                  if ($_.Name -like $exclude) {
                    $skip = $true
                    break
                  }
                }
                if (-not $skip) {
                  Copy-Item "$($_.FullName)" "$collect" -Force
                  $copied += $_.Name
                }
              }
            }
          }

          $copied = $copied | Sort-Object -Unique
          if ($copied.Count -eq 0) { throw "No output files collected" }
          $copied | Set-Content "${{ github.workspace }}\collected-files.txt"
          "count=$($copied.Count)" >> $env:GITHUB_OUTPUT

      - name: Create release bundles
        id: bundle
        run: |
          $artifactDir = "${{ github.workspace }}\artifact"
          $assetPrefix = "${{ needs.preflight.outputs.asset_prefix }}"

          $bundlePath = Join-Path "${{ github.workspace }}" "${assetPrefix}_bundle.zip"
          if (Test-Path $bundlePath) { Remove-Item $bundlePath -Force }
          Compress-Archive -Path (Join-Path $artifactDir '*') -DestinationPath $bundlePath
          "bundle_path=$bundlePath" >> $env:GITHUB_OUTPUT

          $standaloneDir = "${{ github.workspace }}\out-standalone"
          $standaloneBundlePath = $null
          if (Test-Path $standaloneDir) {
            $standaloneBundlePath = Join-Path "${{ github.workspace }}" "${assetPrefix}_standalone.zip"
            if (Test-Path $standaloneBundlePath) { Remove-Item $standaloneBundlePath -Force }
            Compress-Archive -Path (Join-Path $standaloneDir '*') -DestinationPath $standaloneBundlePath
            "standalone_bundle_path=$standaloneBundlePath" >> $env:GITHUB_OUTPUT
          }

          $assets = @("$bundlePath")
          if ($standaloneBundlePath) { $assets += $standaloneBundlePath }
          "asset_paths=$($assets -join ';')" >> $env:GITHUB_OUTPUT

      - name: Publish release assets
        run: |
          $tag = "${{ needs.preflight.outputs.release_tag }}"
          $name = "${{ needs.preflight.outputs.release_name }}"
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          if ("${{ inputs.force_rebuild }}" -eq "true") {
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag *> $null
          }

          $assetPaths = "${{ steps.bundle.outputs.asset_paths }}"
          $assets = $assetPaths.Split(';')
          gh release create "$tag" @assets `
            --repo "${{ github.repository }}" `
            --title "$name" `
            --notes "Automated build for ${{ needs.preflight.outputs.repo_url }} @ ${{ needs.preflight.outputs.resolved_commit }}"

          if ($LASTEXITCODE -ne 0) {
            gh release view "$tag" --repo "${{ github.repository }}" --json tagName *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release already exists after publish attempt; treating as successful race winner"
              "Release publish raced with another run for $tag" >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }

            throw "Release publish failed"
          }

      - name: Update build profile
        run: |
          $profileDir = Join-Path "${{ github.workspace }}" "tools\profiles"
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null

          $cfg = "${{ inputs.configuration }}"
          if ([string]::IsNullOrWhiteSpace($cfg)) {
            $cfg = "${{ needs.preflight.outputs.configuration }}"
          }
          if ([string]::IsNullOrWhiteSpace($cfg)) { $cfg = "Release" }

          $fw = "${{ inputs.target_framework }}"
          if ([string]::IsNullOrWhiteSpace($fw)) {
            $fw = "${{ needs.preflight.outputs.target_framework }}"
          }

          $includeRaw = "${{ inputs.asset_include }}"
          if ([string]::IsNullOrWhiteSpace($includeRaw)) {
            $includeRaw = "${{ needs.preflight.outputs.asset_include }}"
          }
          $excludeRaw = "${{ inputs.asset_exclude }}"
          if ([string]::IsNullOrWhiteSpace($excludeRaw)) {
            $excludeRaw = "${{ needs.preflight.outputs.asset_exclude }}"
          }

          $targetRoot = "${{ github.workspace }}\target\"
          $projectPath = "${{ steps.project.outputs.path }}"
          if ($projectPath.StartsWith($targetRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
            $projectPath = $projectPath.Substring($targetRoot.Length)
          }

          $profile = [ordered]@{
            tool_id = "${{ needs.preflight.outputs.tool_id }}"
            repo_url = "${{ needs.preflight.outputs.repo_url }}"
            project_path = $projectPath
            configuration = $cfg
            target_framework = $fw
            version_strategy = "${{ needs.preflight.outputs.version_strategy }}"
            restore_mode = "${{ needs.preflight.outputs.restore_mode }}"
            build_mode = "${{ needs.preflight.outputs.build_mode }}"
            asset_include = if ([string]::IsNullOrWhiteSpace($includeRaw)) { @() } else { $includeRaw.Split(",", [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim() } }
            asset_exclude = if ([string]::IsNullOrWhiteSpace($excludeRaw)) { @() } else { $excludeRaw.Split(",", [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim() } }
          }

          $profilePath = Join-Path $profileDir "${{ needs.preflight.outputs.tool_id }}.json"
          $profile | ConvertTo-Json -Depth 5 | Set-Content $profilePath -Encoding UTF8

      - name: Commit build profile and catalog
        run: |
          $profileFile = "tools/profiles/${{ needs.preflight.outputs.tool_id }}.json"
          $profileContent = Get-Content -Raw $profileFile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $branch = "${{ github.ref_name }}"
          for ($i = 0; $i -lt 3; $i++) {
            git fetch origin "$branch"
            if ($LASTEXITCODE -ne 0) { continue }

            git reset --hard "origin/$branch"
            if ($LASTEXITCODE -ne 0) { continue }

            Set-Content -Path $profileFile -Value $profileContent -Encoding UTF8
            git add $profileFile

            $catalogFile = "tools/catalog.yml"
            $catalogContent = Get-Content -Raw $catalogFile
            $toolId = "${{ needs.preflight.outputs.tool_id }}"
            $repoUrl = "${{ needs.preflight.outputs.repo_url }}"
            $alreadyInCatalog = $catalogContent -match "(?m)^\s+- id:\s+$([regex]::Escape($toolId))\s*$"
            if (-not $alreadyInCatalog) {
              $entry = "  - id: $toolId`n    repo_url: $repoUrl`n    enabled: true`n    default_configuration: Release`n    version_strategy: tag_then_commit`n"
              $catalogContent = $catalogContent.TrimEnd() + "`n" + $entry
              Set-Content -Path $catalogFile -Value $catalogContent -Encoding UTF8
              git add $catalogFile
              Write-Host "Added $toolId to catalog"
            }

            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host "No changes to commit"
              exit 0
            }

            git commit -m "Update build profile and catalog for $toolId"
            if ($LASTEXITCODE -ne 0) { continue }

            git push origin "HEAD:$branch"
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }

          throw "Unable to push build profile update"

      - name: Cleanup
        if: always()
        run: |
          Remove-Item -Recurse -Force "${{ github.workspace }}\target" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "${{ github.workspace }}\out" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "${{ github.workspace }}\artifact" -ErrorAction SilentlyContinue
